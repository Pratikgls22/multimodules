# Datasource properties
spring:
  # spring batch
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always


  datasource:
    url: jdbc:mysql://localhost:3306/jobportal_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver


  # Jpa properties
  jpa:
    hibernate:
      ddl-auto: update
    #    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Elasticsearch
  data:
    elasticsearch:
      repositories:
        enabled: true
      uris: http://localhost:9200
      username: elastic
      password: elastic

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

